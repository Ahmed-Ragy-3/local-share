<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Share</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-title">
                <h1>Local Share</h1>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-indicator disconnected" id="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <div class="messages" id="messages">
                <div class="system-message">Welcome to Local Share! Connected devices can send messages and files here.</div>
            </div>
        </main>

        <footer class="input-area">
            <div class="file-upload-wrapper">
                <input type="file" id="file-input" multiple hidden>
                <button type="button" id="file-btn" class="icon-btn" title="Attach file">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>
                <button type="button" id="browse-pc-btn" class="icon-btn" title="Browse PC">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
            </div>
            
            <textarea id="message-input" placeholder="Message..." rows="1"></textarea>
            
            <button type="button" id="send-btn" class="primary-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>

        <div id="pc-browser-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Browse PC</h2>
                    <button type="button" id="close-browser-btn" class="icon-btn" style="font-size: 24px;">&times;</button>
                </div>
                <div class="modal-path-nav">
                    <button type="button" id="up-dir-btn" class="icon-btn" title="Up one level">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                    <div id="current-path" class="current-path">/</div>
                </div>
                <div class="modal-search">
                    <input type="text" id="pc-browser-search" placeholder="Search files and folders..." autocomplete="off">
                </div>
                <div id="file-list" class="file-list">
                    <!-- File items will go here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
