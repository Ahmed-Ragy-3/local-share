<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Share - Remote Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .glow-effect {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 120px;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            filter: blur(50px);
            opacity: 0.3;
            border-radius: 50%;
            z-index: 0;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
        }

        .logo-box svg {
            width: 32px;
            height: 32px;
            stroke: #ffffff;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input.has-toggle {
            padding-right: 48px;
        }

        .form-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(30, 41, 59, 0.85);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: #f8fafc;
        }

        .btn-connect {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-connect:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-connect:active {
            transform: translateY(0);
        }

        .btn-connect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glow-effect"></div>
        <div class="auth-card">
            <div class="brand-header">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                </div>
                <h1 class="brand-title">Local Share Remote</h1>
                <p class="brand-subtitle">Enter your Ngrok URL and password to access your local PC</p>
            </div>

            <div id="alert-box" class="alert-box"></div>

            <form id="auth-form">
                <div class="form-group">
                    <label class="form-label" for="ngrok-url">Ngrok Server URL</label>
                    <div class="input-wrapper">
                        <input type="url" id="ngrok-url" class="form-input" placeholder="https://xxxx-xx-xx.ngrok-free.app" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input has-toggle" placeholder="Enter password" required>
                        <button type="button" class="toggle-pw" id="toggle-pw" title="Show/Hide Password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-connect" id="submit-btn">
                    <span id="btn-text">Connect to Local Share</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </form>

            <div class="footer-note">
                Encrypted with Bcrypt & JWT • Deployable on GitHub Pages
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const ngrokUrlInput = document.getElementById('ngrok-url');
        const passwordInput = document.getElementById('password');
        const togglePw = document.getElementById('toggle-pw');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');

        // Load saved Ngrok URL if available
        const savedNgrokUrl = localStorage.getItem('local_share_ngrok_url');
        if (savedNgrokUrl) {
            ngrokUrlInput.value = savedNgrokUrl;
        }

        togglePw.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        function showAlert(msg, isSuccess = false) {
            alertBox.textContent = msg;
            alertBox.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
            alertBox.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            let rawUrl = ngrokUrlInput.value.trim();
            if (!rawUrl) return;

            // Normalize URL format
            if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
                rawUrl = 'https://' + rawUrl;
            }
            rawUrl = rawUrl.replace(/\/+$/, ''); // Strip trailing slashes

            const password = passwordInput.value.trim();
            if (!password) return;

            alertBox.style.display = 'none';
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;

            try {
                // Save valid URL to localStorage
                localStorage.setItem('local_share_ngrok_url', rawUrl);

                const response = await fetch(`${rawUrl}/api/verify-password`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success && data.token) {
                    showAlert('Password verified! Redirecting to Local Share...', true);
                    
                    // Redirect to Local Share on PC with authorization token
                    setTimeout(() => {
                        window.location.href = `${rawUrl}/?token=${encodeURIComponent(data.token)}`;
                    }, 800);
                } else {
                    throw new Error(data.error || 'Incorrect password.');
                }
            } catch (err) {
                console.error('Connection failed:', err);
                showAlert(err.message || 'Could not connect to Ngrok server. Verify your Ngrok URL and check if Local Share is running on your PC.');
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
